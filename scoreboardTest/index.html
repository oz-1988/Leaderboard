<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Scoreboard Test Harness</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b0b0e;
      color: #fff;
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 18px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 900px) {
      .wrap {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 12px 44px rgba(0, 0, 0, 0.35);
    }

    .title {
      font-size: 18px;
      font-weight: 800;
      margin: 0 0 10px;
    }

    .row {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    label {
      font-size: 12px;
      opacity: 0.85;
      display: block;
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
      outline: none;
    }

    .field {
      flex: 1;
      min-width: 180px;
    }

    button {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    button.primary {
      margin-top: 20px;
      background: #2f7cff;
      border-color: #2f7cff;
    }

    button.danger {
      background: rgba(255, 0, 80, 0.20);
      border-color: rgba(255, 0, 80, 0.35);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .hint {
      font-size: 12px;
      opacity: 0.75;
      margin-top: 10px;
      line-height: 1.4;
    }

    .log {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 12px;
      white-space: pre-wrap;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid rgba(255, 255, 255, 0.10);
      border-radius: 12px;
      padding: 10px;
      max-height: 230px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 8px;
    }

    th,
    td {
      text-align: left;
      padding: 10px 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.10);
      font-size: 13px;
    }

    th {
      font-size: 12px;
      opacity: 0.75;
    }

    tr.you {
      outline: 2px solid rgba(47, 124, 255, 0.8);
      outline-offset: -2px;
      background: rgba(47, 124, 255, 0.12);
    }

    .pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 11px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      opacity: .9;
    }

    .error {
      margin-top: 10px;
      font-size: 13px;
      color: #ff6b93;
    }

    .ok {
      margin-top: 10px;
      font-size: 13px;
      color: #7dffb3;
    }

    .sb-error {
      margin-top: 10px;
      font-size: 12px;
      color: #ffb3b3;
      opacity: .95;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <div class="title">Controls</div>

      <div class="row">
        <div class="field">
          <label>API Base URL</label>
          <input id="apiBase" value="http://localhost:3000" />
        </div>
        <div class="field">
          <label>Game Slug</label>
          <input id="gameSlug" value="202051023_Trolli_Gummi_Platformer" />
        </div>
      </div>

      <div class="row" style="margin-top: 10px;">
        <div class="field">
          <label>Score</label>
          <input id="score" type="number" value="1200" />
        </div>
        <button id="btnEnd" class="primary">Simulate Game End</button>

      </div>

      <div class="row" style="margin-top: 20px;">
        <button id="btnLeaderboard">Fetch Leaderboard</button>
        <button id="btnResetSession" class="danger">Reset Nickname Lock</button>
        <button id="btnResetAll" class="danger">Reset UUID</button>
      </div>

      <div id="status" class="hint">
        Expectation: <br />
        • If you <b>Skip</b> nickname, the leaderboard loads and a local <span class="pill">YOU</span> row is
        highlighted, but score is <b>not stored</b>. <br />
        • If you <b>Submit</b> nickname, score is stored, and future game ends auto-submit without prompting (same
        session).
      </div>

      <div id="msg"></div>

      <div class="title" style="margin-top: 14px;">Debug Log</div>
      <div id="log" class="log"></div>
    </div>

    <div class="card">
      <div class="title">Leaderboard</div>
      <div id="lbMeta" class="hint"></div>
      <div id="lb"></div>
    </div>
  </div>

  <!-- Scoreboard templates -->
  <template id="sb-modal-template">
    <div class="sb-backdrop" data-sb="backdrop">
      <div class="sb-card" role="dialog" aria-modal="true">
        <div class="sb-title">Add your nickname</div>
        <div class="sb-subtitle">Enter a nickname to appear on the leaderboard.</div>
        <div class="sb-scoreline">Score: <b data-sb="score"></b></div>

        <input class="sb-input" type="text" maxlength="12" placeholder="3–12 chars" data-sb="input" />
        
        <div class="sb-error" data-sb="error" style="display:none;"></div>
        
        <div class="sb-actions">
          <button class="sb-btn sb-btn-secondary" data-sb="skip">Skip</button>
          <button class="sb-btn sb-btn-primary" data-sb="submit">Submit</button>
        </div>

        <div class="sb-hint">Allowed: letters, numbers, space, _ -</div>
      </div>
    </div>
  </template>

  <template id="sb-leaderboard-template">
    <div class="sb-backdrop" data-sb="backdrop">
      <div class="sb-card">
        <div class="sb-title">Leaderboard</div>
        <div class="sb-subtitle" data-sb="meta"></div>

        <div class="sb-list-head">
          <div>Rank</div>
          <div>Nickname</div>
          <div>Score</div>
        </div>

        <div data-sb="rows"></div>

        <div class="sb-close-row">
          <button class="sb-btn" data-sb="close">Close</button>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="./main.js"></script>
</body>

</html>
