<template id="sb-modal-template">
    <div class="sb-backdrop" data-sb="backdrop">
      <div class="sb-card" role="dialog" aria-modal="true">
        <div class="sb-title">Add your nickname</div>
        <div class="sb-subtitle">Enter a nickname to appear on the leaderboard.</div>
        <div class="sb-scoreline">Score: <b data-sb="score"></b></div>

        <input class="sb-input" type="text" maxlength="12" placeholder="3–12 chars" data-sb="input" />

        <div class="sb-actions">
          <button class="sb-btn sb-btn-secondary" data-sb="skip">Skip</button>
          <button class="sb-btn sb-btn-primary" data-sb="submit">Submit</button>
        </div>

        <div class="sb-hint">Allowed: letters, numbers, space, _ -</div>
      </div>
    </div>
  </template>
