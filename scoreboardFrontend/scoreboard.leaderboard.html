<template id="sb-leaderboard-template">
  <div class="sb-backdrop" data-sb="backdrop">
    <div class="sb-card">
      <div class="sb-title">Leaderboard</div>
      <div class="sb-subtitle" data-sb="meta"></div>

      <div class="sb-list-head">
        <div>Rank</div>
        <div>Nickname</div>
        <div>Score</div>
      </div>

      <div data-sb="rows"></div>

      <div class="sb-close-row">
        <button class="sb-btn" data-sb="close">Close</button>
      </div>
    </div>
  </div>
</template>
